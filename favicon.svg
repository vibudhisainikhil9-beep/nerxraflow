<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="64" height="64" rx="16" fill="#090d14" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <!-- Outer Shield -->
  <path d="M32 8 L49 14 C49 28 44 43 32 52 C20 43 15 28 15 14 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" />
  
  <!-- Inner Shield Highlight -->
  <path d="M32 12 L45 16.5 C45 28 41 39.5 32 47 C23 39.5 19 28 19 16.5 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="1.5" />

  <!-- Flow Kinematic Waves / Signal Nodes -->
  <circle cx="32" cy="24" r="3" fill="#4ade80" />
  <circle cx="26" cy="32" r="2.5" fill="#38bdf8" />
  <circle cx="38" cy="32" r="2.5" fill="#fbbf24" />
  <circle cx="32" cy="40" r="2" fill="#f87171" />
  
  <path d="M32 27 L26 30 M32 27 L38 30 M26 35 L32 38 M38 35 L32 38" 
        stroke="rgba(255,255,255,0.7)" 
        stroke-width="1.5" 
        stroke-linecap="round" />
</svg>
